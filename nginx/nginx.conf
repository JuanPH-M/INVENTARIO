# Proxy inverso de Inventario Pro.
#   /api/*  → API NestJS (puerto 3001)
#   /*      → Web Next.js (puerto 3000)
# Para HTTPS, coloca fullchain.pem y privkey.pem en nginx/ssl/ y descomenta el bloque 443.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  client_max_body_size 60m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Límite de peticiones por IP (protección adicional al rate limit de la API)
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  upstream api_upstream { server api:3001; keepalive 32; }
  upstream web_upstream { server web:3000; keepalive 32; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Cabeceras de proxy heredadas por todas las ubicaciones
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 90s;

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://api_upstream;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api_upstream;
    }

    location /health {
      proxy_pass http://api_upstream;
      access_log off;
    }

    location / {
      proxy_pass http://web_upstream;
    }
  }

  # ── HTTPS (opcional) ─────────────────────────────────────────────
  # server {
  #   listen 443 ssl http2;
  #   server_name tu-dominio.com;
  #   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   add_header Strict-Transport-Security "max-age=31536000" always;
  #   location /api/ { proxy_pass http://api_upstream; }
  #   location /     { proxy_pass http://web_upstream; }
  # }
}
