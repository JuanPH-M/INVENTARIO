worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 100M;

  # Security headers (development — sin HSTS)
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript
             application/rss+xml application/atom+xml image/svg+xml;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/m;
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=20r/m;
  limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=30r/m;

  # ─────────────────────────────────────────────────────────────────
  # Upstream servers — apuntan a localhost en desarrollo
  # ─────────────────────────────────────────────────────────────────
  upstream api_backend {
    server 127.0.0.1:3001;
    keepalive 32;
  }

  upstream web_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
  }

  # ─────────────────────────────────────────────────────────────────
  # Servidor único en puerto 80 — desarrollo local
  # Accesible en: http://localhost
  # ─────────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name localhost;

    # ── Frontend Next.js ──────────────────────────────────────────
    location / {
      proxy_pass http://web_frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 60s;
    }

    # ── API NestJS — todas las rutas /api ────────────────────────
    location /api {
      limit_req zone=api_limit burst=50 nodelay;

      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 30s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # ── Auth login — rate limit más estricto ─────────────────────
    location /api/auth/login {
      limit_req zone=login_limit burst=5 nodelay;

      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── File uploads ─────────────────────────────────────────────
    location /api/storage/upload {
      limit_req zone=upload_limit burst=10 nodelay;
      client_max_body_size 100M;

      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # ── Swagger UI ───────────────────────────────────────────────
    location /api/docs {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # ── WebSocket ────────────────────────────────────────────────
    location /api/ws {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # ── Health check ─────────────────────────────────────────────
    location /health {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
