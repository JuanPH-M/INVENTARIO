# ─────────────────────────────────────────────────────────────────────────────
# Inventario Pro — despliegue de producción en un solo servidor
#
#   1. cp .env.example .env      (y completa las variables marcadas como OBLIGATORIAS)
#   2. docker compose up -d --build
#   3. Abre http://IP-DEL-SERVIDOR  (o tu dominio)
#
# Sirve tanto para un servidor en la nube como para un equipo dentro de la red
# local de la empresa al que se conectan todas las sedes.
# ─────────────────────────────────────────────────────────────────────────────
name: inventario-pro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventario}
      POSTGRES_USER: ${POSTGRES_USER:-inventario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-inventario} -d ${POSTGRES_DB:-inventario}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      APP_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventario}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inventario}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_PATH: /app/apps/api/uploads
    volumes:
      - uploads_data:/app/apps/api/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend, frontend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks: [frontend]

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  backend:
  frontend:
