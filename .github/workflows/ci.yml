name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tipos, pruebas y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventario
          POSTGRES_PASSWORD: inventario
          POSTGRES_DB: inventario_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inventario"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://inventario:inventario@localhost:5432/inventario_test?schema=public
      TEST_DATABASE_URL: postgresql://inventario:inventario@localhost:5432/inventario_test?schema=public
      JWT_DEV_SECRET: ci-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm db:generate

      - name: Verificación de tipos
        run: pnpm typecheck

      - name: Pruebas unitarias (API + Web)
        run: pnpm test

      - name: Pruebas end-to-end (API contra PostgreSQL)
        run: pnpm test:e2e

      - name: Build de producción
        run: pnpm build
